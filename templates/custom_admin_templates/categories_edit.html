{% extends 'custom_admin_templates/base.html' %}
{% load static %}

{% block title %}Edit Category{% endblock %}
{% block page_title %}Edit Category{% endblock %}

{% block content %}

<div class="page-header">
  <h2>Edit: {{ category.name }}</h2>
  <a href="{% url 'manage_categories' %}" class="btn btn-outline">← Back to categories</a>
</div>

<div class="card" style="max-width:500px;">

  <!-- edit form -->
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label>Category Name *</label>
      <!-- pre-filled with current name -->
      <input type="text" name="name" class="form-control"
             value="{{ category.name }}" required autofocus>
    </div>

    <div style="display:flex; gap:12px; margin-top:8px;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{% url 'manage_categories' %}" class="btn btn-outline">Cancel</a>
    </div>

  </form>

  <!-- delete form — outside edit form -->
  <form method="post" action="{% url 'category_delete' category.id %}"
        style="margin-top:20px; border-top:1px solid #e5e7eb; padding-top:16px;"
        onsubmit="return confirm('Delete {{ category.name }}? Products using this category will be affected.')">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete This Category</button>
  </form>

</div>

{% endblock %}
