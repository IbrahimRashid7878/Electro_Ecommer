{% extends 'custom_admin_templates/base.html' %}
{% load static %}

{% block title %}Add Coupon{% endblock %}
{% block page_title %}Add Coupon{% endblock %}

{% block content %}

<div class="page-header">
  <h2>Add New Coupon</h2>
  <a href="{% url 'manage_coupons' %}" class="btn btn-outline">← Back to coupons</a>
</div>

<div class="card" style="max-width:550px;">
  <form method="post">
    {% csrf_token %}

    <!-- Coupon Code -->
    <div class="form-group">
      <label>Coupon Code *</label>
      <input type="text" name="code" class="form-control"
             placeholder="e.g. SAVE20" required autofocus
             style="text-transform:uppercase; letter-spacing:2px;">
      <small style="color:var(--text-secondary);">
        Will be saved in uppercase automatically.
      </small>
    </div>

    <!-- Discount Percent -->
    <div class="form-group">
      <label>Discount Percent (%) *</label>
      <input type="number" name="discount_percent" class="form-control"
             placeholder="e.g. 20" min="1" max="100" required>
    </div>

    <!-- Valid From -->
    <div class="form-group">
      <label>Valid From *</label>
      <input type="datetime-local" name="valid_from" class="form-control" required>
    </div>

    <!-- Valid To -->
    <div class="form-group">
      <label>Valid To *</label>
      <input type="datetime-local" name="valid_to" class="form-control" required>
    </div>

    <!-- Active checkbox -->
    <div class="form-group" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" name="active" id="active"
             style="width:18px; height:18px;" checked>
      <label for="active" style="margin:0;">
        Active (uncheck to create as inactive)
      </label>
    </div>

    <div style="display:flex; gap:12px; margin-top:8px;">
      <button type="submit" class="btn btn-primary">Save Coupon</button>
      <a href="{% url 'manage_coupons' %}" class="btn btn-outline">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
